name: Publicar Lab Enaccion

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generar catalogo de documentos
        run: python scripts/generar_indice.py

      - name: Mostrar catalogo generado
        run: cat documentos.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
