<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

content="Repositorio académico de informes, proyectos y documentos de Lab Enacción.">

<style>

:root{
  --azul-oscuro:#092B52;
  --azul:#0D5493;
  --azul-medio:#2878B5;
  --azul-claro:#EAF3FB;
  --amarillo:#FFD43B;
  --blanco:#FFFFFF;
  --fondo:#F7FAFD;
  --gris:#65758B;
  --borde:#DDE7F0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--fondo);
  color:var(--azul-oscuro);
  min-height:100vh;
}

/* Fondo inspirado en cognición corporizada */

.background{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:-1;
}

.node{
  position:absolute;
  border-radius:50%;
  opacity:.15;
  animation:float 9s ease-in-out infinite;
}

.node.blue{
  background:var(--azul);
  width:220px;
  height:220px;
  top:8%;
  right:-80px;
}

.node.yellow{
  background:var(--amarillo);
  width:180px;
  height:180px;
  left:-70px;
  top:45%;
  animation-delay:-3s;
}

.node.small{
  background:var(--azul-medio);
  width:80px;
  height:80px;
  bottom:12%;
  right:12%;
  animation-delay:-5s;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
}

.container{
  width:min(1180px,91%);
  margin:auto;
}

/* HERO */

header{
  padding:70px 0 42px;
}

.label{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--amarillo);
  padding:9px 16px;
  border-radius:30px;
  font-size:.85rem;
  font-weight:700;
  margin-bottom:22px;
}

h1{
  font-size:clamp(3rem,7vw,5.7rem);
  letter-spacing:-4px;
  line-height:.95;
}

.subtitle{
  margin-top:20px;
  font-size:1.25rem;
  line-height:1.6;
  color:var(--gris);
  max-width:720px;
}

.author{
  margin-top:11px;
  color:var(--azul);
  font-weight:650;
}
